# 校园综合服务平台 · 本地环境（MySQL 8 + Redis 7）
# 使用本地已有镜像（无需联网拉取）；宿主端口 3308/6380，与 12306、DOVideo 项目完全错开
services:
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: campus123456
      MYSQL_DATABASE: campus_platform
      TZ: Asia/Shanghai
    # local_infile=1：允许 LOAD DATA LOCAL INFILE 批量导入种子数据（阶段 2）
    # max-connections=500：阶段 14 分库分表后，ShardingSphere 双层连接池
    #（外层 128 + 内层 2 库 × 128：热点分片会把同分片连接吃满）会把默认 151 顶满
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --local-infile=1 --max-connections=500
    volumes:
      - ./volumes/mysql:/var/lib/mysql
      - ./resources/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pcampus123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: campus-redis
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "campus123456"]
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a campus123456 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
